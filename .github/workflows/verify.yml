name: verify-public-artifact

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            environment/requirements-core.txt
            environment/requirements-figures.txt
      - name: Install replay dependencies
        run: python -m pip install -r environment/requirements-figures.txt
      - name: Run synthetic unit tests
        env:
          PYTHONPATH: src
        run: python -B -m unittest discover -s tests -p 'test_*.py'
      - name: Verify public allowlist and checksums
        run: python -B scripts/verify_release.py
      - name: Replay frozen figures
        run: python -B scripts/build_public_figures.py
      - name: Compare replay tables with frozen originals
        run: python -B scripts/check_figure_tables.py
      - name: Verify frozen files were not changed
        run: python -B scripts/verify_release.py
